name: ci

on: [ push, pull_request ]

jobs:
  tests:
    name: unit tests
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        nvim-version: [ stable, nightly ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}
      - name: Install plenary-busted plugin
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            packpath="$HOME/AppData/Local/nvim-data/site"
          else
            packpath="$HOME/.local/share/nvim/site"
          fi
          git clone --depth=1 -b fix_paths https://github.com/monkoose/plenary-busted "$packpath/pack/test-workflow/start/plenary-busted"
      - name: Run tests
        run: |
          nvim --version
          make test

  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .
